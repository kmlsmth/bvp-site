<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>At the Plate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  /* Layout: homepage list of a day's games -> a game page with a weather
     card and a batter-vs-pitcher stat table. A "viewing lineup vs." dropdown
     at the top of the table lists every probable starter in that day's
     full slate, not just this game's two -- picking one jumps straight to
     that pitcher's own game page. The lineup table shows the full stat
     line (matching the old dailybaseballdata.com column set) in a
     horizontally-scrolling table, with a team-totals row at the bottom. */
  :root {
    --bg: #f6f3ea; --surface: #ffffff; --surface-2: #efebdf;
    --ink: #1b2018; --muted: #666f63; --line: #dedacb;
    --accent: #2f6f4f; --accent-ink: #ffffff; --accent-soft: #e4efe7;
    --stitch: #a8393a;
    --font-display: 'Fraunces', Georgia, serif;
    --font-body: 'IBM Plex Sans', system-ui, -apple-system, sans-serif;
    --font-mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14170f; --surface: #1c2016; --surface-2: #232819;
      --ink: #eef0e7; --muted: #9aa392; --line: #333a28;
      --accent: #5fa47c; --accent-ink: #0c140f; --accent-soft: #1f2e22;
      --stitch: #d4716b; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14170f; --surface: #1c2016; --surface-2: #232819;
    --ink: #eef0e7; --muted: #9aa392; --line: #333a28;
    --accent: #5fa47c; --accent-ink: #0c140f; --accent-soft: #1f2e22;
    --stitch: #d4716b; color-scheme: dark;
  }

  * { box-sizing: border-box; }
  /* Hard backstop, on top of the min-width fixes below: whatever specific
     element ends up demanding extra width (several rounds of flex-item
     min-width fixes narrowed it down but evidently didn't catch every
     case on every real device), the page itself should never be allowed
     to scroll sideways -- only the BVP table's own .table-scroll box is
     meant to do that, and it's a separate, nested scroll container, so
     this doesn't affect it. */
  html, body { margin: 0; overflow-x: hidden; }
  body { background: var(--bg); color: var(--ink); font-family: var(--font-body); }
  .wrap { max-width: 900px; margin: 0 auto; padding: 28px 16px 64px; display: flex; flex-direction: column; gap: 20px; }
  /* Flex items default to a minimum width based on their content's own
     intrinsic size, not 0 -- so the BVP table below (deliberately
     min-width: 860px so its columns don't get crushed, meant to scroll
     horizontally inside its own .table-scroll box) was instead forcing
     this whole flex column wider than the phone's screen. Some mobile
     browsers respond to that by zooming the entire page out to fit,
     which is what actually made everything look like it was floating in
     a half-used screen with empty space on the right -- not a layout
     choice, a viewport-width bug. min-width: 0 opts shrink-to-fit back
     on. Originally just `.wrap > *` (direct children only), which turned
     out not to be enough: the BVP section's own wrapper is itself a flex
     column (switcher / caption / table-host stacked), so its *children*
     -- two levels down from .wrap, not one -- were still carrying the
     table's min-content width upward uncontained. Broadened to every
     descendant so a flex wrapper at any depth can't do this; the table's
     own explicit `min-width: 860px` still wins where it's meant to,
     since a tag+class selector always beats a bare universal one. */
  .wrap * { min-width: 0; }
  /* iPhone browsers (Safari AND Chrome on iOS -- both are WebKit) ignore
     overflow-x on html/body for touch panning, so the backstop above never
     applied there; the page still panned sideways on a real iPhone even
     though Chromium measured zero overflow. Clipping on .wrap itself (an
     ordinary element, always exactly the viewport's width on a phone) is
     honored by WebKit. `clip` (unlike `hidden`) doesn't turn .wrap into a
     scroll container; `hidden` is the fallback for older browsers. The BVP
     table still scrolls inside its own .table-scroll box. */
  .wrap { overflow-x: hidden; overflow-x: clip; }

  .eyebrow { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); }
  h1 { font-family: var(--font-display); font-weight: 600; font-size: 32px; line-height: 1.08; margin: 0; text-wrap: balance; }
  .sub { color: var(--muted); font-size: 14.5px; max-width: 60ch; }
  .loading { font-size: 13px; color: var(--muted); font-family: var(--font-mono); padding: 4px 0; }

  /* ---- Home: list of games ---- */
  .game-row {
    display: flex; align-items: center; justify-content: space-between; gap: 14px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
    padding: 16px 18px; cursor: pointer; text-align: left; width: 100%;
    font-family: inherit; color: inherit;
  }
  .game-row:hover { border-color: var(--accent); }
  .game-row .matchup-name { font-family: var(--font-display); font-size: 18px; font-weight: 600; }
  .game-row .matchup-name .at { color: var(--muted); font-style: italic; font-weight: 500; padding: 0 4px; }
  .game-row .pitchers-line { font-size: 12.5px; color: var(--muted); margin-top: 4px; }
  .game-row .chev { flex-shrink: 0; width: 18px; height: 18px; color: var(--muted); transform: rotate(-90deg); }
  .games-list { display: flex; flex-direction: column; gap: 10px; }

  /* ---- Bullpen fatigue badges (schedule list + game page) ---- */
  .bullpen-badges { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 6px; }
  .bp-badge { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.02em; display: inline-flex; align-items: center; gap: 5px; }
  .bp-badge .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .bp-fresh .dot { background: var(--accent); }
  .bp-moderate .dot { background: var(--muted); }
  .bp-taxed .dot { background: var(--stitch); opacity: 0.7; }
  .bp-exhausted .dot { background: var(--stitch); }
  .bp-fresh, .bp-moderate { color: var(--muted); }
  .bp-taxed, .bp-exhausted { color: var(--stitch); }

  /* ---- Info tip: a small tappable "i" with a floating explanation.
     Native title="" tooltips don't fire on touch devices at all, which is
     most of this site's real-world traffic -- so this is a tiny custom
     component instead: shows on hover (desktop) AND on tap (mobile, via
     a "show" class toggled in JS), and a document-level click handler
     closes it again on a tap elsewhere. ---- */
  .info-tip { display: inline-flex; align-items: center; justify-content: center; width: 15px; height: 15px; border-radius: 50%; background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); font-family: var(--font-mono); font-size: 9.5px; font-weight: 600; line-height: 1; cursor: pointer; position: relative; flex-shrink: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  /* The bubble itself is appended to <body> and positioned in JS (see
     positionInfoTip below), NOT a CSS ::after on the button -- several
     places this is used (the bullpen fatigue pill, in particular) sit
     inside a card with overflow:hidden for its rounded corners, which
     silently clipped an ::after-based tooltip trying to float above it. */
  .info-tip-bubble { position: fixed; background: var(--ink); color: var(--bg); font-family: var(--font-body); font-size: 11.5px; font-weight: 400; line-height: 1.4; padding: 9px 11px; border-radius: 9px; white-space: normal; text-align: left; opacity: 0; visibility: hidden; transition: opacity 0.12s; box-shadow: 0 6px 18px rgba(0,0,0,0.2); z-index: 1000; pointer-events: none; }
  .info-tip-bubble.show { opacity: 1; visibility: visible; }

  /* ---- Bullpen Watch card (game page) ---- */
  .bullpen-cards { display: flex; flex-direction: column; gap: 10px; }
  .bullpen-card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .bullpen-card-head { display: flex; align-items: center; gap: 10px; padding: 14px 16px; cursor: pointer; }
  .bullpen-card-head:hover { background: var(--surface-2); }
  .bullpen-head-main { flex: 1 1 auto; min-width: 0; }
  .bullpen-team-name { font-family: var(--font-display); font-size: 15.5px; font-weight: 600; }
  .bullpen-meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .fatigue-pill { display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0; font-family: var(--font-mono); font-size: 13px; font-weight: 600; letter-spacing: 0.01em; padding: 6px 10px; border-radius: 999px; }
  .fatigue-pill .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .fatigue-pill.bp-fresh { background: var(--accent-soft); color: var(--accent); }
  .fatigue-pill.bp-fresh .dot { background: var(--accent); }
  .fatigue-pill.bp-moderate { background: var(--surface-2); color: var(--ink); }
  .fatigue-pill.bp-moderate .dot { background: var(--muted); }
  .fatigue-pill.bp-taxed, .fatigue-pill.bp-exhausted { background: var(--stitch); color: var(--accent-ink); }
  .fatigue-pill.bp-taxed { opacity: 0.85; }
  .fatigue-pill.bp-taxed .dot, .fatigue-pill.bp-exhausted .dot { background: var(--accent-ink); }
  .fatigue-pill .info-tip { background: rgba(0,0,0,0.12); border-color: transparent; color: inherit; }
  .fatigue-pill.bp-fresh .info-tip, .fatigue-pill.bp-moderate .info-tip { background: rgba(0,0,0,0.08); }
  .bullpen-card-body { border-top: 1px solid var(--line); padding: 10px 16px 14px; display: none; }
  .bullpen-card.expanded .bullpen-card-body { display: block; }
  .bullpen-card-body table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .bullpen-card-body th { text-align: right; font-size: 10px; text-transform: uppercase; color: var(--muted); padding: 4px 6px; font-weight: 600; }
  .bullpen-card-body th:first-child, .bullpen-card-body td:first-child { text-align: left; }
  .bullpen-card-body td { text-align: right; padding: 4px 6px; font-family: var(--font-mono); }
  .bullpen-card-body td:first-child { font-family: var(--font-body); }
  .bullpen-card-chev { width: 16px; height: 16px; color: var(--muted); flex-shrink: 0; transition: transform 0.15s; }
  .bullpen-card.expanded .bullpen-card-chev { transform: rotate(180deg); }
  .recent-form-note { display: block; font-size: 12px; color: var(--muted); margin-top: 3px; }

  /* ---- Starting lineups (game page) ---- */
  /* Side-by-side on every width, phones included -- two narrower columns
     of 9 short lines each fit comfortably, and stacking them full-width
     only made you scroll twice as far for the same information. */
  .lineups-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .lineup-card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; min-width: 0; }
  .lineup-card .bullpen-team-name { margin-bottom: 2px; }
  .lineup-card .lineup-sp { font-size: 12.5px; color: var(--muted); margin-bottom: 10px; }
  .lineup-card .lineup-sp strong { color: var(--ink); font-weight: 600; }
  .lineup-card ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 5px; }
  .lineup-card li { display: flex; align-items: baseline; gap: 7px; font-size: 13.5px; min-width: 0; }
  .lineup-order { font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); width: 13px; flex-shrink: 0; text-align: right; }
  .lineup-pos { font-family: var(--font-mono); font-size: 11px; color: var(--muted); flex-shrink: 0; }
  .lineup-name { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  @media (max-width: 420px) {
    .lineup-card { padding: 12px 10px; }
    .lineup-card .bullpen-team-name { font-size: 14px; }
    .lineup-card li { font-size: 12.5px; gap: 5px; }
  }

  /* ---- Starting pitchers overview (game page) ----
     Side by side on wide screens, stacked on phones: each card is a small
     4-column stat table, which needs the full width to stay readable. */
  .sp-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (max-width: 640px) { .sp-grid { grid-template-columns: 1fr; } }
  .sp-card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
  .sp-head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .sp-name { font-family: var(--font-display); font-size: 16.5px; font-weight: 600; }
  .sp-hand { font-family: var(--font-mono); font-size: 11px; font-weight: 600; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; }
  .sp-team { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .sp-stats { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 12.5px; }
  .sp-stats th { font-size: 10px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); font-weight: 600; text-align: right; padding: 0 0 6px 6px; white-space: nowrap; }
  .sp-stats th .info-tip { vertical-align: -3px; margin-left: 2px; }
  .sp-stats td { text-align: right; font-family: var(--font-mono); font-variant-numeric: tabular-nums; padding: 6px 0 6px 6px; border-top: 1px solid var(--line); white-space: nowrap; }
  .sp-stats th:first-child, .sp-stats td:first-child { text-align: left; padding-left: 0; font-family: var(--font-body); }
  .sp-stats td:first-child { color: var(--muted); font-size: 12px; white-space: normal; }
  .sp-tba { color: var(--muted); font-size: 13px; margin-top: 8px; }

  .empty-day { background: var(--surface); border: 1px dashed var(--line); border-radius: 14px; padding: 28px 20px; text-align: center; color: var(--muted); font-size: 14px; }
  .date-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .date-row input[type="date"] { font-family: var(--font-mono); font-size: 14px; background: var(--surface); border: 1px solid var(--line); color: var(--ink); border-radius: 8px; padding: 8px 10px; }
  .today-btn { font-family: var(--font-body); font-size: 13px; font-weight: 500; background: var(--surface); border: 1px solid var(--line); color: var(--ink); border-radius: 8px; padding: 8px 12px; cursor: pointer; }
  .today-btn:hover { border-color: var(--accent); }

  /* ---- Game page ---- */
  .back-link {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 13px; font-weight: 500; color: var(--muted);
    background: none; border: none; cursor: pointer; padding: 0; font-family: inherit;
    align-self: flex-start;
  }
  .back-link:hover { color: var(--accent); }

  /* ---- Matchup card (game page header): a boxed, centered summary like
     the rest of the page's cards, instead of a bare page title floating
     on the background -- team names, then game time and probable
     pitchers/venue underneath. ---- */
  .matchup-card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 24px 20px; text-align: center; }
  .matchup-teams { display: flex; align-items: center; justify-content: center; gap: 14px; flex-wrap: wrap; margin: 0; }
  .matchup-team-name { font-family: var(--font-display); font-weight: 600; font-size: 23px; line-height: 1.15; text-wrap: balance; }
  .matchup-at { font-family: var(--font-display); font-style: italic; font-weight: 500; font-size: 15px; color: var(--muted); flex-shrink: 0; }
  .matchup-time { font-family: var(--font-mono); font-size: 14px; font-weight: 600; color: var(--accent); margin-top: 12px; }
  .matchup-sub { font-size: 13.5px; color: var(--muted); margin-top: 4px; }
  @media (max-width: 480px) {
    .matchup-team-name { font-size: 18px; }
    .matchup-teams { gap: 8px; }
  }

  .section-label { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin: 4px 2px -4px; }
  .tabs-note { font-size: 12px; color: var(--muted); font-style: italic; }

  /* ---- BVP tab: pitcher switcher + full stat table ---- */
  .pitcher-switch {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    padding: 12px 14px;
  }
  .pitcher-switch label { font-size: 12px; color: var(--muted); font-weight: 500; white-space: nowrap; }
  .pitcher-switch select {
    flex: 1; min-width: 200px;
    font-family: var(--font-body); font-size: 14.5px; font-weight: 500; color: var(--ink);
    background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px;
    padding: 8px 10px;
  }
  .lineup-caption { font-size: 13px; color: var(--muted); margin: 2px 2px 0; }
  .lineup-caption strong { color: var(--ink); }

  .table-scroll { overflow-x: auto; max-width: 100%; border: 1px solid var(--line); border-radius: 12px; }
  table.lineup { width: 100%; border-collapse: collapse; font-size: 12.5px; min-width: 860px; }
  table.lineup thead th {
    text-align: right; font-size: 10px; letter-spacing: 0.03em; text-transform: uppercase;
    color: var(--muted); font-weight: 600; padding: 8px 9px; border-bottom: 1px solid var(--line);
    background: var(--surface-2); position: sticky; top: 0;
  }
  table.lineup thead th:first-child { text-align: left; position: sticky; left: 0; z-index: 1; }
  table.lineup tbody td {
    text-align: right; font-family: var(--font-mono); font-variant-numeric: tabular-nums;
    padding: 9px; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--surface);
  }
  table.lineup tbody td:first-child {
    font-family: var(--font-body); white-space: normal; text-align: left;
    position: sticky; left: 0; background: var(--surface);
  }
  table.lineup tbody tr:nth-child(even) td { background: var(--surface-2); }
  table.lineup tbody tr:nth-child(even) td:first-child { background: var(--surface-2); }
  table.lineup tbody tr:last-child td { border-bottom: none; }
  table.lineup .ops-cell, table.lineup .woba-cell { font-weight: 600; }
  table.lineup .hot { color: var(--accent); }
  table.lineup .cold { color: var(--stitch); }
  table.lineup tfoot td {
    font-weight: 600; padding: 10px 9px; border-top: 2px solid var(--line);
    background: var(--accent-soft); font-family: var(--font-mono); text-align: right;
  }
  table.lineup tfoot td:first-child { text-align: left; font-family: var(--font-body); position: sticky; left: 0; background: var(--accent-soft); }

  /* ---- Season-vs-hand + matchup estimate table (under the BVP table) ---- */
  .est-head { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); margin: 14px 2px 6px; }
  .pp-block { margin-top: 18px; }
  .pp-head { display: flex; align-items: center; gap: 8px; margin: 0 2px 6px; }
  .pp-title { font-family: var(--font-display); font-size: 17px; font-weight: 600; }
  .pp-badge { font-family: var(--font-mono); font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: 3px 8px; }
  .pp-intro { font-size: 13px; color: var(--muted); margin: 0 2px 8px; line-height: 1.45; }
  .pp-intro strong { color: var(--ink); }
  .h2h-line { display: block; font-family: var(--font-mono); font-size: 10.5px; color: var(--muted); }
  .est-head strong { color: var(--ink); }
  table.lineup.est { min-width: 600px; }
  table.lineup.est thead th { white-space: nowrap; }
  table.lineup.est thead tr.grp-row th { text-align: center; font-size: 9.5px; letter-spacing: 0.08em; padding-bottom: 2px; border-bottom: none; }
  table.lineup.est thead th { padding-left: 7px; padding-right: 7px; }
  table.lineup.est tbody td { padding-left: 7px; padding-right: 7px; }
  table.lineup.est .est-col { background: var(--accent-soft); }
  table.lineup.est tbody tr:nth-child(even) td.est-col { background: var(--accent-soft); }
  table.lineup.est th.est-col { color: var(--accent); }
  table.lineup.est .first-real { border-left: 2px solid var(--line); }
  .bat-side { font-family: var(--font-mono); font-size: 10.5px; color: var(--muted); margin-left: 4px; }
  .order-num { font-family: var(--font-mono); font-size: 11px; color: var(--muted); margin-right: 5px; }
  .no-h2h { font-family: var(--font-mono); font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.03em; color: var(--stitch); border: 1px solid currentColor; border-radius: 4px; padding: 0 4px; margin-left: 5px; white-space: nowrap; }
  .bench-row td { color: var(--muted); }
  .est-note { font-size: 11.5px; color: var(--muted); margin: 6px 2px 0; }
  table.lineup > tbody > tr.mix-row > td { background: var(--surface-2) !important; padding: 10px 12px; white-space: normal !important; text-align: left !important; position: static !important; }
  /* Sized to the visible box (not the wide table) and pinned to its left
     edge, so the breakdown is readable on a phone without scrolling. */
  .mix-detail { font-family: var(--font-body); font-size: 12.5px; color: var(--ink); max-width: min(520px, calc(100vw - 72px)); position: sticky; left: 12px; }
  .mix-sum { margin-bottom: 8px; }
  table.mix-table { border-collapse: collapse; font-size: 12px; min-width: 0; width: auto; }
  table.mix-table th { font-size: 10px; text-transform: uppercase; color: var(--muted); font-weight: 600; padding: 3px 10px 3px 0; text-align: right; background: none; border: none; position: static; }
  table.mix-table th:first-child, table.mix-table td:first-child { text-align: left; font-family: var(--font-body); }
  table.mix-table td { padding: 3px 10px 3px 0; text-align: right; font-family: var(--font-mono); background: none !important; border: none; position: static; white-space: nowrap; }
  .mix-pa { color: var(--muted); font-size: 10.5px; }
  .mix-note { font-size: 11px; color: var(--muted); margin-top: 6px; }

  .no-history-note { font-size: 12.5px; color: var(--muted); font-style: italic; padding: 2px 2px; }

  /* ---- Weather: lives right on the matchup page, field-relative arrow ----

  .weather-card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px 22px; display: flex; align-items: center; gap: 22px; flex-wrap: wrap; }

  /* Small arrow paired directly with the HR factor number when today's

  @media (max-width: 900px) {

  @media (max-width: 420px) {

  }
</style>
